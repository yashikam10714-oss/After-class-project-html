<!DOCTYPE html>
<html lang="en">

<head>
    <title>
        Pagination example
    </title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>

<body>
    <div class="container">
        <h2>Pagination Example</h2>
        <ul class="pagination">
            <li class="page-item">

                <a class="page-link"  href="#">Page no. 1</a>
            </li>
            <li class="page-item">
                <a class="page-link"  href="#">Page no. 2</a>
            </li>
            <li class="page-item">
                <a class="page-link"  href="#">Page no. 3</a>
            </li>
            <li class="page-item">
                <a class="page-link"  href="#">Page no. 4</a>
            </li>
            <li class="page-item">
                <a class="page-link"  href="#">LAST page</a>
            </li>
        </ul>
    </div>
</body>
</html>
